name: CI

on:
  push:
    branches:
      - main
      - 'codex/**'
  pull_request:

jobs:
  verify:
    runs-on: ubuntu-latest

    steps:
      - name: Check out repository
        uses: actions/checkout@v4

      - name: Set up Node.js
        uses: actions/setup-node@v4
        with:
          node-version: 20
          cache: npm

      - name: Install dependencies
        run: npm ci

      - name: Verify route integrity
        run: npm run verify:routes

      - name: Verify database init
        run: npm run db:verify

      - name: Typecheck
        run: npm run check

      - name: Build
        run: npm run build

      - name: Validate Promptfoo security configs
        run: npm run promptfoo:security:validate
