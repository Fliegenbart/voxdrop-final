events {
  worker_connections 128;
}

http {
  server {
    listen 8000;
    server_name _;

    # vLLM OpenAI-compatible endpoint healthcheck used in docker-compose.yml
    location = /v1/models {
      default_type application/json;
      return 200 '{"object":"list","data":[]}';
    }

    location / {
      return 200 'ok';
    }
  }
}

