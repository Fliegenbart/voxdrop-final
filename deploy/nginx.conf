events {
    worker_connections 1024;
}

http {
    include /etc/nginx/mime.types;
    default_type application/octet-stream;

    # Docker DNS resolver (refresh upstream IPs)
    resolver 127.0.0.11 ipv6=off valid=30s;
    resolver_timeout 5s;

    # Logging
    access_log /var/log/nginx/access.log;
    error_log /var/log/nginx/error.log;

    # Gzip compression
    gzip on;
    gzip_vary on;
    gzip_min_length 1024;
    gzip_types text/plain text/css application/json application/javascript text/xml application/xml;

    # Security headers
    add_header X-Frame-Options "DENY" always;
    add_header X-Content-Type-Options "nosniff" always;
    add_header X-XSS-Protection "1; mode=block" always;
    add_header Referrer-Policy "strict-origin-when-cross-origin" always;
    # HSTS - enforce HTTPS for 1 year, include subdomains
    add_header Strict-Transport-Security "max-age=31536000; includeSubDomains; preload" always;
    # CSP is set by the app layer. Do not duplicate it in nginx, because browsers
    # enforce multiple CSP headers as an intersection, which can accidentally block
    # allowed connect/download endpoints.
    # Permissions Policy
    add_header Permissions-Policy "geolocation=(), camera=(self), microphone=(self), payment=(), usb=(), display-capture=(self)" always;

    # Rate limiting zones
    limit_req_zone $binary_remote_addr zone=api:10m rate=10r/s;
    limit_req_zone $binary_remote_addr zone=upload:10m rate=2r/s;
    limit_req_zone $binary_remote_addr zone=auth:10m rate=30r/m;  # Auth rate limit (relaxed for UX)

    # Upstream
    upstream voxdrop {
        zone voxdrop 64k;
        server web:5000 resolve max_fails=3 fail_timeout=15s;
        keepalive 32;
    }

    # HTTP -> HTTPS redirect
    server {
        listen 80;
        server_name _;

        # Let's Encrypt challenge
        location /.well-known/acme-challenge/ {
            root /var/www/certbot;
        }

        location / {
            return 301 https://$host$request_uri;
        }
    }

    # HTTPS server - VoxDrop
    server {
        listen 443 ssl http2;
        server_name voxdrop.live www.voxdrop.live;

        # SSL certificates (will be created by certbot)
        ssl_certificate /etc/nginx/ssl/live/voxdrop.live/fullchain.pem;
        ssl_certificate_key /etc/nginx/ssl/live/voxdrop.live/privkey.pem;

        # SSL settings
        ssl_protocols TLSv1.2 TLSv1.3;
        ssl_ciphers ECDHE-ECDSA-AES128-GCM-SHA256:ECDHE-RSA-AES128-GCM-SHA256:ECDHE-ECDSA-AES256-GCM-SHA384:ECDHE-RSA-AES256-GCM-SHA384;
        ssl_prefer_server_ciphers off;
        ssl_session_cache shared:SSL:10m;
        ssl_session_timeout 1d;

        # Upload size limit (for video files)
        client_max_body_size 500M;

        # Auth endpoints - stricter rate limiting (KRITIS/brute-force protection)
        location /api/auth/ {
            limit_req zone=auth burst=3 nodelay;
            proxy_pass http://voxdrop;
            proxy_http_version 1.1;
            proxy_set_header Host $host;
            proxy_set_header X-Real-IP $remote_addr;
            proxy_set_header X-Forwarded-For $proxy_add_x_forwarded_for;
            proxy_set_header X-Forwarded-Proto $scheme;
            proxy_read_timeout 30s;
            proxy_connect_timeout 10s;
        }

        # Session uploads (premium screen recordings up to 5GB)
        location /api/session {
            limit_req zone=upload burst=20 nodelay;
            proxy_pass http://voxdrop;
            proxy_http_version 1.1;
            proxy_set_header Host $host;
            proxy_set_header X-Real-IP $remote_addr;
            proxy_set_header X-Forwarded-For $proxy_add_x_forwarded_for;
            proxy_set_header X-Forwarded-Proto $scheme;
            proxy_set_header Connection "";

            # Avoid buffering huge uploads in nginx memory/disk
            proxy_request_buffering off;
            proxy_buffering off;

            # Large body + long-running uploads
            client_max_body_size 5G;
            client_body_timeout 3600s;
            proxy_read_timeout 3600s;
            proxy_send_timeout 3600s;
            proxy_connect_timeout 120s;

            keepalive_timeout 600s;
        }

	        # SSE job updates (no buffering, long-lived)
	        location /api/jobs/events {
	            proxy_pass http://voxdrop;
	            proxy_http_version 1.1;
	            proxy_set_header Host $host;
            proxy_set_header X-Real-IP $remote_addr;
            proxy_set_header X-Forwarded-For $proxy_add_x_forwarded_for;
            proxy_set_header X-Forwarded-Proto $scheme;
            proxy_set_header Connection "";

            proxy_buffering off;
            proxy_cache off;

            proxy_read_timeout 3600s;
            proxy_send_timeout 3600s;
	            keepalive_timeout 3600s;
	        }

	        # Alt-text generator (uploads can be slow via corporate proxies/Cloudflare).
	        # Without a longer client_body_timeout nginx may return 408 before the request
	        # even reaches the app, so GPU work never starts.
	        location = /api/generate-alt-text {
	            limit_req zone=upload burst=10 nodelay;

	            proxy_pass http://voxdrop;
	            proxy_http_version 1.1;
	            proxy_set_header Host $host;
	            proxy_set_header X-Real-IP $remote_addr;
	            proxy_set_header X-Forwarded-For $proxy_add_x_forwarded_for;
	            proxy_set_header X-Forwarded-Proto $scheme;
	            proxy_set_header Connection "";

	            # Keep request buffering ON for robustness with HTTP/2 + proxy chains (Safari/iCloud Private Relay).
	            # We rely on the extended client_body_timeout instead.

	            proxy_read_timeout 900s;
	            proxy_connect_timeout 60s;
	            proxy_send_timeout 600s;

	            client_body_timeout 600s;
	            keepalive_timeout 600s;
	        }

	        # API routes with rate limiting
	        location /api/ {
	            limit_req zone=api burst=20 nodelay;
	            proxy_pass http://voxdrop;
	            proxy_http_version 1.1;
            proxy_set_header Host $host;
            proxy_set_header X-Real-IP $remote_addr;
            proxy_set_header X-Forwarded-For $proxy_add_x_forwarded_for;
            proxy_set_header X-Forwarded-Proto $scheme;

            # Longer timeout for transcription
            proxy_read_timeout 600s;
            proxy_connect_timeout 60s;
        }

        # Upload endpoint with stricter rate limiting
        location /api/upload {
            limit_req zone=upload burst=5 nodelay;
            proxy_pass http://voxdrop;
            proxy_http_version 1.1;
            proxy_set_header Host $host;
            proxy_set_header X-Real-IP $remote_addr;
            proxy_set_header X-Forwarded-For $proxy_add_x_forwarded_for;
            proxy_set_header X-Forwarded-Proto $scheme;
            proxy_read_timeout 600s;
        }

        # PPTX tools (Kontrastchecker, PDF conversion) - special handling for large uploads
        location /api/tools/pptx {
            limit_req zone=upload burst=10 nodelay;

            proxy_pass http://voxdrop;
            proxy_http_version 1.1;
            proxy_set_header Host $host;
            proxy_set_header X-Real-IP $remote_addr;
            proxy_set_header X-Forwarded-For $proxy_add_x_forwarded_for;
            proxy_set_header X-Forwarded-Proto $scheme;
            proxy_set_header Connection "";

            # Disable buffering for uploads
            proxy_request_buffering off;
            proxy_buffering off;

            # Extended timeouts for processing
            proxy_read_timeout 900s;
            proxy_connect_timeout 60s;
            proxy_send_timeout 600s;

            # Larger body size for PPTX files
            client_max_body_size 200M;
            client_body_timeout 600s;

            # Keepalive
            keepalive_timeout 600s;
        }

        # Convert PPTX endpoint - same settings (no trailing slash to avoid 301 redirects)
        location /api/convert-pptx {
            limit_req zone=upload burst=10 nodelay;

            proxy_pass http://voxdrop;
            proxy_http_version 1.1;
            proxy_set_header Host $host;
            proxy_set_header X-Real-IP $remote_addr;
            proxy_set_header X-Forwarded-For $proxy_add_x_forwarded_for;
            proxy_set_header X-Forwarded-Proto $scheme;
            proxy_set_header Connection "";

            proxy_request_buffering off;
            proxy_buffering off;

            proxy_read_timeout 900s;
            proxy_connect_timeout 60s;
            proxy_send_timeout 600s;

            client_max_body_size 200M;
            client_body_timeout 600s;

            keepalive_timeout 600s;
        }

        # Don't expose source maps in production (makes reverse-engineering harder).
        location ~* \.map$ {
            return 404;
        }

        # Static files and SPA
        location / {
            proxy_pass http://voxdrop;
            proxy_http_version 1.1;
            proxy_set_header Host $host;
            proxy_set_header X-Real-IP $remote_addr;
            proxy_set_header X-Forwarded-For $proxy_add_x_forwarded_for;
            proxy_set_header X-Forwarded-Proto $scheme;
        }
    }

    # =====================================================================
    # fluxengine.labpulse.ai - LabPulse/ViralFlux Media Intelligence
    # =====================================================================
    server {
        listen 443 ssl http2;
        server_name fluxengine.labpulse.ai;

        ssl_certificate /etc/nginx/ssl/live/labpulse.ai/fullchain.pem;
        ssl_certificate_key /etc/nginx/ssl/live/labpulse.ai/privkey.pem;
        ssl_protocols TLSv1.2 TLSv1.3;

        client_max_body_size 50M;

        location / {
            proxy_pass http://172.17.0.1:18080;
            proxy_http_version 1.1;
            proxy_set_header Host $host;
            proxy_set_header X-Real-IP $remote_addr;
            proxy_set_header X-Forwarded-For $proxy_add_x_forwarded_for;
            proxy_set_header X-Forwarded-Proto $scheme;
            proxy_read_timeout 120s;
        }
    }

    # labpulse.ai / www.labpulse.ai -> redirect to fluxengine subdomain
    server {
        listen 443 ssl http2;
        server_name labpulse.ai www.labpulse.ai;

        ssl_certificate /etc/nginx/ssl/live/labpulse.ai/fullchain.pem;
        ssl_certificate_key /etc/nginx/ssl/live/labpulse.ai/privkey.pem;
        ssl_protocols TLSv1.2 TLSv1.3;

        return 301 https://fluxengine.labpulse.ai$request_uri;
    }

    # =====================================================================
    # controlling-engine.de - Controlling Engine App
    # =====================================================================
    server {
        listen 443 ssl http2;
        server_name controlling-engine.de www.controlling-engine.de;

        ssl_certificate /etc/nginx/ssl/live/controlling-engine.de/fullchain.pem;
        ssl_certificate_key /etc/nginx/ssl/live/controlling-engine.de/privkey.pem;
        ssl_protocols TLSv1.2 TLSv1.3;

        client_max_body_size 50M;

        location / {
            proxy_pass http://controlling-engine:3000;
            proxy_http_version 1.1;
            proxy_set_header Host $host;
            proxy_set_header X-Real-IP $remote_addr;
            proxy_set_header X-Forwarded-For $proxy_add_x_forwarded_for;
            proxy_set_header X-Forwarded-Proto $scheme;
            proxy_set_header Upgrade $http_upgrade;
            proxy_set_header Connection "upgrade";
            proxy_read_timeout 120s;
        }
    }

}