  <body>
    <script>
    // Force skip welcome screen by pre-setting Zustand persisted state
    try {
      var key = "openreel-ui-preferences";
      var raw = localStorage.getItem(key);
      var store = raw ? JSON.parse(raw) : { state: {}, version: 0 };
      if (!store.state) store.state = {};
      store.state.skipWelcomeScreen = true;
      store.state.showWelcomeScreen = false;
      localStorage.setItem(key, JSON.stringify(store));
      // Also skip onboarding tour
      localStorage.setItem("voxdrop-studio-onboarding-complete", "true");
    } catch(e) {}
    // Force editor route
    if (!location.hash || location.hash === "#/" || location.hash === "#") {
      location.hash = "#/editor";
    }
    </script>
